<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
  <title id="title">Signal for Omarchy</title>
  <desc id="desc">A quiet Sentry incident inbox shown beside a live Signal panel.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#75b9dc" stroke-width="1" opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1440" height="350" fill="#0b171e"/>
  <rect width="1440" height="350" fill="url(#grid)"/>
  <circle cx="126" cy="154" r="72" fill="#10252f" stroke="#75b9dc" stroke-width="4"/>
  <circle cx="126" cy="154" r="18" fill="#75b9dc"/>
  <path d="M126 63a91 91 0 0 1 91 91" fill="none" stroke="#75b9dc" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <path d="M126 245a91 91 0 0 1-91-91" fill="none" stroke="#75b9dc" stroke-width="5" stroke-linecap="round" opacity=".18"/>
  <text x="260" y="145" fill="#f2f7f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="76" font-weight="700">Signal</text>
  <text x="266" y="198" fill="#75b9dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="3">SENTRY × OMARCHY</text>
  <text x="266" y="245" fill="#b8c8cf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">Production stays quiet until it needs you.</text>
  <image href="panel-closeup.png" x="1115" y="15" width="301" height="321" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
</svg>
